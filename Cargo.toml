[workspace]
resolver = "3"
members = [
    "bhwi", "bhwi-async", "bhwi-wasm", "bhwi-cli", "bhwi-async-transport", "bhwi-ipc", "e2e/*"
]
# bhwi-ipc is left out: it serves a Unix socket and its build.rs needs the capnp
# binary, which the Windows CI job has neither of.
default-members = ["bhwi", "bhwi-async", "bhwi-cli", "bhwi-async-transport"]

[workspace.package]
authors = ["Edouard Paris <m@edouard.paris>", "Trevor Arjeski <tmarjeski@gmail.com>", "PraneethGunas <praneethgunas404@gmail.com>"]
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/wizardsardine/bhwi"

[workspace.dependencies]
aes = "0.8.3"
anyhow = "1"
async-trait = "0.1"
base64ct = "1.8.3"
bitcoin = "0.32.2"
clap = { version = "4.4.7", features = ["derive"] }
bhwi = { path = "./bhwi", version = "0.1", default-features = false }
bhwi-async = { path = "./bhwi-async", version = "0.1", default-features = false }
bhwi-async-transport = { path = "./bhwi-async-transport", version = "0.1", default-features = false }
capnp = "0.27.2"
capnp-rpc = "0.27"
capnpc = "0.27"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
hex = "0.4.3"
log = "0.4"
miniscript = "13.2.0"
rand_core = "0.6.4"
reqwest = "0.13.5"
serde = "1.0.228"
serde_json = "1.0.149"
serde_cbor = "0.11.2"
thiserror = "1"
tokio = "1.0"
tokio-util = "0.7"
