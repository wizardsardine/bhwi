[workspace]
resolver = "3"
members = [
    "bhwi", "bhwi-async", "bhwi-wasm", "bhwi-cli", "e2e/*"
]
default-members = ["bhwi", "bhwi-async", "bhwi-cli"]

[workspace.package]
authors = ["Edouard Paris <m@edouard.paris>", "Trevor Arjeski <tmarjeski@gmail.com>"]
license-file = "LICENSE"

[workspace.dependencies]
aes = "0.8.3"
anyhow = "1"
async-trait = "0.1"
base64ct = "1.8.3"
bitcoin = "0.32.2"
# default-features = false so consumers opt into device features explicitly
# (bhwi-async forwards them; its defaults keep all devices enabled)
bhwi = { path = "./bhwi", version = "0.0.1", default-features = false }
bhwi-async = { path = "./bhwi-async", version = "0.0.1", default-features = false }
futures = "0.3"
hex = "0.4.3"
log = "0.4"
# Can move to a version once WalletPolicy is in a release
miniscript = { git = "https://github.com/rust-bitcoin/rust-miniscript.git", rev = "ff4732e5" }
rand_core = "0.6.4"
reqwest = "0.13.4"
serde = "1.0.228"
serde_json = "1.0.149"
serde_cbor = "0.11.2"
thiserror = "1"
tokio = "1.0"
