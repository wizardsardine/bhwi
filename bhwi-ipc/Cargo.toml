[package]
name = "bhwi-ipc"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "../README.md"
keywords = ["bitcoin", "miniscript", "hardware-wallet", "ipc"]
description = "Cap'n Proto server exposing bhwi to other processes"

[[bin]]
name = "bhwi-ipc"
path = "src/bin/bhwi-ipc.rs"

[features]
default = ["bitbox", "coldcard", "jade", "keepkey", "ledger", "specter", "trezor"]
bitbox = ["bhwi-async-transport/bitbox", "dep:chrono"]
coldcard = ["bhwi-async-transport/coldcard"]
jade = ["bhwi-async-transport/jade"]
keepkey = ["bhwi-async-transport/keepkey", "dep:async-trait", "dep:chrono"]
ledger = ["bhwi-async-transport/ledger"]
specter = ["bhwi-async-transport/specter"]
trezor = ["bhwi-async-transport/trezor", "dep:async-trait", "dep:chrono"]

[dependencies]
anyhow.workspace = true
async-trait = { workspace = true, optional = true }
bhwi-async = { workspace = true, default-features = false }
bhwi-async-transport = { workspace = true, default-features = false }
bitcoin = { workspace = true, features = ["base64"] }
capnp.workspace = true
capnp-rpc.workspace = true
chrono = { workspace = true, optional = true }
clap.workspace = true
futures.workspace = true
miniscript.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "io-util", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }

[build-dependencies]
capnpc.workspace = true
