[package]
name = "bhwi-async"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "../README.md"
keywords = ["bitcoin", "miniscript", "hardware-wallet"]
description = "Async HWI trait over the bhwi sans-IO Bitcoin hardware wallet interpreters"

[features]
default = ["bitbox", "coldcard", "jade", "keepkey", "ledger", "specter", "trezor"]
bitbox = ["bhwi/bitbox"]
coldcard = ["bhwi/coldcard"]
jade = ["bhwi/jade", "serde_cbor"]
keepkey = ["bhwi/keepkey"]
ledger = ["bhwi/ledger"]
specter = ["bhwi/specter"]
trezor = ["bhwi/trezor"]

[dependencies]
async-trait.workspace = true
bhwi.workspace = true
serde_cbor = { workspace = true, optional = true }
thiserror.workspace = true

byteorder = "1.5"

[dev-dependencies]
futures.workspace = true
