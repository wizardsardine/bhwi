[package]
name = "bhwi-async"
version = "0.0.1"
edition = "2024"
authors.workspace = true
repository = "https://github.com/wizardsardine/bhwi"
license-file.workspace = true
keywords = ["bitcoin",  "miniscript"]
description = "development kit"

# See more keys and their definitions at
# https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["bitbox", "coldcard", "jade", "keepkey", "ledger", "trezor"]
bitbox = ["bhwi/bitbox"]
coldcard = ["bhwi/coldcard"]
jade = ["bhwi/jade", "serde_cbor"]
keepkey = ["bhwi/keepkey"]
ledger = ["bhwi/ledger"]
trezor = ["bhwi/trezor"]

[dependencies]
async-trait.workspace = true
bhwi.workspace = true
futures.workspace = true
serde_cbor = { workspace = true, optional = true }
thiserror.workspace = true

byteorder = "1.5"
