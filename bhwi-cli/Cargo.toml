[package]
name = "bhwi-cli"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "../README.md"
keywords = ["bitcoin", "miniscript", "hardware-wallet", "cli"]
description = "Command-line tool to talk to Bitcoin hardware wallets, plus an hwi parity binary"

[[bin]]
name = "bhwi"
path = "src/bin/bhwi.rs"

[[bin]]
name = "hwi"
path = "src/bin/hwi.rs"

[features]
default = ["bitbox", "coldcard", "jade", "keepkey", "ledger", "specter", "trezor"]
bitbox = ["bhwi-async-transport/bitbox"]
coldcard = ["bhwi-async-transport/coldcard"]
jade = ["bhwi-async-transport/jade"]
keepkey = ["bhwi-async-transport/keepkey"]
ledger = ["bhwi-async-transport/ledger"]
specter = ["bhwi-async-transport/specter"]
trezor = ["bhwi-async-transport/trezor"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bitcoin = { workspace = true, features = ["base64", "serde"] }
bhwi-async = { workspace = true, default-features = false }
bhwi = { workspace = true, default-features = false }
bhwi-async-transport = { workspace = true, default-features = false }
chrono.workspace = true
futures.workspace = true
hex = { workspace = true, features = ["serde"] }
miniscript = { workspace = true, features = ["serde"] }
rand_core = { workspace = true, features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "io-util", "sync", "time"] }

clap = { workspace = true }
rpassword = "=7.5.4"
