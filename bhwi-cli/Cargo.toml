[package]
name = "bhwi-cli"
version = "0.0.1"
edition = "2024"
authors.workspace = true
repository = "https://github.com/wizardsardine/bhwi"
license-file.workspace = true
keywords = ["bitcoin",  "miniscript"]
description = "cli tool to talk to hardware wallet"

[[bin]]
name = "bhwi"
path = "src/bin/bhwi.rs"

[[bin]]
name = "hwi"
path = "src/bin/hwi.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bitcoin = { workspace = true, features = ["base64", "serde"] }
bhwi-async = { workspace = true, features = ["bitbox", "coldcard", "jade", "keepkey", "ledger", "trezor"] }
bhwi.workspace = true
bhwi-async-transport = { workspace = true, features = ["bitbox", "coldcard", "jade", "ledger", "trezor"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures.workspace = true
hex = { workspace = true, features = ["serde"] }
miniscript = { workspace = true, features = ["serde"] }
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "io-util", "sync", "time"] }

clap = { workspace = true }
rpassword = "=7.5.4"
